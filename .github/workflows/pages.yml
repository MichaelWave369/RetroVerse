name: RetroVerse build and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: retroverse-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Portable archive roundtrip tests
        run: npm test
      - name: Build site and fetch open firmware
        run: npm run build
        env:
          GITHUB_PAGES: "1"
      - name: Smoke-check required assets
        run: |
          test -s dist/index.html
          test -s dist/vendor/v86.wasm
          test -s dist/vendor/seabios.bin
          test -s dist/vendor/vgabios.bin
          test "$(wc -c < dist/media/freedos722.img)" -eq 737280
          test -s dist/amiga/example.htm
          test -s dist/amiga/example.js
          test -s dist/amiga/sae/amiga.js
          test -s dist/amiga/sae/audio_worklet.js
          test -s dist/amiga/gpl.htm
          test -s dist/amiga/SOURCE-PROVENANCE.txt
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
